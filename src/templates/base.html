<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}PitWall{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <header>
      <a class="brand" href="{{ url_for('index') }}">PitWall</a>
      <span class="tagline">Post-session coaching report</span>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
